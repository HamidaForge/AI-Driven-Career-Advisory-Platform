async function askClaude(prompt, maxTokens=1000) {
  const key = window._SPAI_KEY || "";
  if(!key) throw new Error("NO_KEY");
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + key,
      "HTTP-Referer":"https://skillpathai.com",
      "X-Title":"SkillPath AI"
    },
    body: JSON.stringify({
      model:"anthropic/claude-sonnet-4",
      max_tokens: maxTokens,
      messages:[{role:"user", content: prompt}]
    })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message || JSON.stringify(data.error));
  return data.choices[0].message.content;
}

// ══ EXTRACT TEXT FROM UPLOADED FILE ══
async function extractTextFromFile(file) {
  // ── TXT ──
  if (file.type === "text/plain" || file.name.endsWith(".txt")) {
    return await file.text();
  }
  // ── DOCX ──
  if (file.name.endsWith(".docx") || file.type.includes("wordprocessingml")) {
    try {
      const arrayBuffer = await file.arrayBuffer();
      // Decode raw bytes; DOCX is a ZIP — extract XML text content
      const uint8 = new Uint8Array(arrayBuffer);
      // Convert to latin1 string to search ZIP contents
      let raw = "";
      for(let i=0;i<uint8.length;i++) raw += String.fromCharCode(uint8[i]);
      // Extract all <w:t> text nodes from word/document.xml
      const matches = raw.match(/<w:t(?:\s[^>]*)?>([^<]*)<\/w:t>/g) || [];
      const text = matches.map(m => m.replace(/<[^>]+>/g,"")).join(" ").trim();
      if(text.length > 30) return text;
    } catch(e){ console.warn("DOCX parse error",e); }
    return "";
  }
  // ── PDF — use PDF.js with disableWorker so no separate worker file needed ──
  if (file.name.endsWith(".pdf") || file.type === "application/pdf") {
    try {
      // Disable worker to avoid CDN worker loading issues in local/offline context
      if(window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "";
      }
      const arrayBuffer = await file.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({
        data: arrayBuffer,
        disableWorker: true,
        disableFontFace: true,
        useSystemFonts: true
      });
      const pdf = await loadingTask.promise;
      let text = "";
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        const pageText = content.items.map(item => item.str || "").join(" ");
        text += pageText + "\n";
      }
      if(text.trim().length > 30) return text;
    } catch(e){ console.warn("PDF.js error:", e); }
    // ── Fallback: read raw bytes and pull ASCII text runs ──
    try {
      const arrayBuffer = await file.arrayBuffer();
      const uint8 = new Uint8Array(arrayBuffer);
      let raw = "";
      for(let i=0;i<uint8.length;i++){
        const ch = uint8[i];
        if(ch>=32&&ch<=126) raw += String.fromCharCode(ch);
        else if(ch===10||ch===13) raw += " ";
      }
      // Pull readable runs of 4+ printable chars
      const runs = raw.match(/[A-Za-z0-9@.,:;()\-\/&\s]{4,}/g) || [];
      const text = runs.join(" ").replace(/\s+/g," ").trim();
      if(text.length > 100) return text;
    } catch(e2){ console.warn("Fallback read error:", e2); }
    return "";
  }
  return "";
}

// ══ AI ADVISOR ══
function AIAdvisor() {
  const SKILLS = ["Python","JavaScript","Java","C++","SQL","R","Machine Learning","Deep Learning","TensorFlow","PyTorch","React","Node.js","HTML/CSS","MongoDB","PostgreSQL","AWS","Azure","GCP","Docker","Kubernetes","Linux","Data Analysis","Pandas","NumPy","Tableau","Power BI","Cybersecurity","Networking","Git","REST APIs","System Design"];
  const INTERESTS = ["Building AI/ML models","Web development","Data analysis","Cloud infrastructure","Security & hacking","Backend systems","Mobile apps","Research","DevOps","Freelancing","Game development","Blockchain","UI/UX Design"];
  const EXPS = ["Fresher (0–1 yr)","Junior (1–3 yrs)","Mid-level (3–5 yrs)","Senior (5+ yrs)"];
  const EDUS = ["12th / Diploma","B.Tech / B.E.","BCA / B.Sc CS","MCA / M.Tech","MBA / Other PG","Self-taught"];

  const [step, setStep] = useState(1);
  const [skills, setSkills] = useState([]);
  const [interests, setInterests] = useState([]);
  const [exp, setExp] = useState("");
  const [edu, setEdu] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [chat, setChat] = useState([]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);

  const tog = (arr, setArr, v) => setArr(p => p.includes(v)?p.filter(x=>x!==v):[...p,v]);

  const analyze = async () => {
    setLoading(true); setError("");
    try {
      const text = await askClaude(`Expert AI career advisor India. Skills:${skills.join(",")}. Interests:${interests.join(",")}. Exp:${exp}. Edu:${edu}. JSON only: {"top_career":"Title","match_score":85,"why":"2 sentences","salary_range":"₹X–Y LPA","time_to_job":"X months","alternative_careers":[{"title":"C","match":75,"reason":"why"},{"title":"C","match":65,"reason":"why"},{"title":"C","match":55,"reason":"why"}],"skill_gaps":["s1","s2","s3","s4"],"recommended_courses":[{"name":"C","platform":"P","duration":"X wks","priority":"High"},{"name":"C","platform":"P","duration":"X wks","priority":"Medium"},{"name":"C","platform":"P","duration":"X wks","priority":"Medium"}],"action_plan":["Month 1: act","Month 2: act","Month 3: act"],"job_titles":["T1","T2","T3"]}`);
      setResult(parseJSON(text));
      setChat([{role:"ai",text:`Profile analyzed! You're a strong fit for **${parseJSON(text).top_career}**. Ask me anything!`}]);
      setStep(4);
    } catch(e){ setError(e.message==="NO_KEY"?"🔑 Please enter your Anthropic API key in the banner above first.":"Analysis failed: "+e.message); }
    setLoading(false);
  };

  const sendChat = async () => {
    if(!chatInput.trim()||chatLoading) return;
    const msg=chatInput.trim(); setChatInput(""); setChatLoading(true);
    setChat(c=>[...c,{role:"user",text:msg}]);
    try {
      const text = await askClaude(`Career advisor. Skills:${skills.join(",")}. Career:${result?.top_career}. Q:${msg}. Answer 3-4 sentences, Indian market.`, 400);
      setChat(c=>[...c,{role:"ai",text}]);
    } catch(e){ setChat(c=>[...c,{role:"ai",text:e.message==="NO_KEY"?"🔑 Please enter your Anthropic API key in the banner above.":"Connection error. Try again."}]); }
    setChatLoading(false);
  };

  const Chip = ({label, selected, onClick}) => (
    <button onClick={onClick} style={{padding:"7px 15px",borderRadius:20,fontSize:12,cursor:"pointer",border:`1.5px solid ${selected?"#354024":"rgba(53,64,36,0.2)"}`,background:selected?"#354024":"#CFBB99",color:selected?"#E5D7C4":"#889063",fontFamily:"'DM Sans',sans-serif",fontWeight:selected?700:500,transition:"all .2s"}}>{label}</button>
  );

  return (
    <div>
      {step<4&&(
        <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:24}}>
          {[1,2,3].map((s,i)=>(
            <React.Fragment key={s}>
              <div style={{width:30,height:30,borderRadius:"50%",background:step>=s?C.k:"rgba(53,64,36,0.1)",color:step>=s?C.b:C.m,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0,transition:"all .3s"}}>{step>s?"✓":s}</div>
              {i<2&&<div style={{flex:1,height:2,background:step>s?C.m:"rgba(53,64,36,0.12)"}}/>}
            </React.Fragment>
          ))}
        </div>
      )}

      {step===1&&<div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:C.k,marginBottom:5}}>Your Skills 🛠</div>
        <div style={{fontSize:13,color:C.m,marginBottom:14,fontWeight:500}}>Select all you know</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>{SKILLS.map(s=><Chip key={s} label={s} selected={skills.includes(s)} onClick={()=>tog(skills,setSkills,s)}/>)}</div>
        <button disabled={!skills.length} onClick={()=>setStep(2)} style={{background:skills.length?C.k:"rgba(53,64,36,0.1)",border:"none",borderRadius:11,padding:"11px 24px",color:skills.length?C.b:C.m,fontSize:14,fontWeight:700,cursor:skills.length?"pointer":"not-allowed",fontFamily:"'DM Sans',sans-serif"}}>Next →</button>
      </div>}

      {step===2&&<div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:C.k,marginBottom:5}}>Interests 🎯</div>
        <div style={{fontSize:13,color:C.m,marginBottom:14,fontWeight:500}}>What excites you?</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>{INTERESTS.map(i=><Chip key={i} label={i} selected={interests.includes(i)} onClick={()=>tog(interests,setInterests,i)}/>)}</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setStep(1)} style={{background:C.t,border:`1.5px solid rgba(53,64,36,0.2)`,borderRadius:11,padding:"11px 20px",color:C.k,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>← Back</button>
          <button disabled={!interests.length} onClick={()=>setStep(3)} style={{background:interests.length?C.k:"rgba(53,64,36,0.1)",border:"none",borderRadius:11,padding:"11px 24px",color:interests.length?C.b:C.m,fontSize:14,fontWeight:700,cursor:interests.length?"pointer":"not-allowed",fontFamily:"'DM Sans',sans-serif"}}>Next →</button>
        </div>
      </div>}

      {step===3&&<div>
        <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:C.k,marginBottom:5}}>Background 🎓</div>
        <div style={{marginBottom:16}}><div style={{fontSize:13,fontWeight:700,color:C.k,marginBottom:9}}>Experience</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{EXPS.map(e=><Chip key={e} label={e} selected={exp===e} onClick={()=>setExp(e)}/>)}</div></div>
        <div style={{marginBottom:22}}><div style={{fontSize:13,fontWeight:700,color:C.k,marginBottom:9}}>Education</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{EDUS.map(e=><Chip key={e} label={e} selected={edu===e} onClick={()=>setEdu(e)}/>)}</div></div>
        {error&&<div style={{background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:10,padding:"11px",color:"#7f1d1d",fontSize:13,marginBottom:12,fontWeight:500}}>{error}</div>}
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setStep(2)} style={{background:C.t,border:`1.5px solid rgba(53,64,36,0.2)`,borderRadius:11,padding:"11px 20px",color:C.k,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>← Back</button>
          <button disabled={loading||!exp||!edu} onClick={analyze} style={{background:(!exp||!edu)?"rgba(53,64,36,0.1)":"linear-gradient(135deg,#354024,#889063)",border:"none",borderRadius:11,padding:"11px 26px",color:(!exp||!edu)?C.m:C.b,fontSize:14,fontWeight:700,cursor:(!exp||!edu)||loading?"not-allowed":"pointer",fontFamily:"'DM Sans',sans-serif"}}>
            {loading?"⏳ Analyzing...":"✦ Get Career Report"}
          </button>
        </div>
      </div>}

      {step===4&&result&&<div>
        <div style={{background:"linear-gradient(135deg,#354024,#889063)",borderRadius:18,padding:"22px 24px",marginBottom:16,boxShadow:"0 8px 28px rgba(53,64,36,0.28)"}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
            <div style={{flex:1}}>
              <div style={{fontSize:10,letterSpacing:"2px",color:"rgba(229,215,196,0.7)",textTransform:"uppercase",fontWeight:600,marginBottom:5}}>Best Career Match</div>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:C.b,marginBottom:6}}>{result.top_career}</div>
              <div style={{fontSize:13,color:C.t,lineHeight:1.6,maxWidth:380,fontWeight:500}}>{result.why}</div>

            <div style={{textAlign:"center",minWidth:70}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:42,fontWeight:800,color:C.b,lineHeight:1}}>{result.match_score}%</div>

            </div>
          </div>
          <div style={{display:"flex",gap:10,marginTop:14,flexWrap:"wrap"}}>
            <div style={{background:"rgba(229,215,196,0.1)",borderRadius:10,padding:"9px 14px",flex:1,minWidth:110}}><div style={{fontSize:10,color:C.t,marginBottom:2,fontWeight:500}}>💰 Salary</div><div style={{fontSize:14,fontWeight:700,color:C.b}}>{result.salary_range}</div></div>
            <div style={{background:"rgba(229,215,196,0.1)",borderRadius:10,padding:"9px 14px",flex:1,minWidth:110}}><div style={{fontSize:10,color:C.t,marginBottom:2,fontWeight:500}}>⏱ Timeline</div><div style={{fontSize:14,fontWeight:700,color:C.b}}>{result.time_to_job}</div></div>

          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.12)",borderRadius:14,padding:"16px"}}>

            {result.alternative_careers?.map(c=>(
              <div key={c.title} style={{display:"flex",gap:10,marginBottom:10,paddingBottom:10,borderBottom:"1px solid rgba(53,64,36,0.08)",alignItems:"center"}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,color:C.k,minWidth:40,textAlign:"center"}}>{c.match}%</div>

          <div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,color:C.k,marginBottom:11}}>✦ Ask AI Advisor <span style={{fontSize:11,color:C.m,fontWeight:500}}>· Claude AI</span></div>
          <div style={{maxHeight:220,overflowY:"auto",display:"flex",flexDirection:"column",gap:9,padding:"12px",background:C.b,borderRadius:12,border:"1.5px solid rgba(53,64,36,0.1)",marginBottom:9}}>

                  {m.role==="ai"&&<div style={{fontSize:9,color:C.m,marginBottom:3,fontWeight:700,textTransform:"uppercase"}}>SkillPath AI</div>}

          </div>
          <div style={{display:"flex",gap:9,marginBottom:9}}>
            <input value={chatInput} onChange={e=>setChatInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendChat()} placeholder="Ask about salary, skills, interviews..." style={{flex:1,background:C.b,border:"2px solid rgba(53,64,36,0.2)",borderRadius:11,padding:"10px 14px",color:C.k,fontSize:13,outline:"none",fontFamily:"'DM Sans',sans-serif"}}/>
            <button onClick={sendChat} disabled={chatLoading} style={{background:C.k,border:"none",borderRadius:11,padding:"10px 16px",color:C.b,fontSize:16,cursor:"pointer"}}>→</button>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {["First job tips?","Expected salary?","Portfolio ideas?","Companies hiring?"].map(q=>(
              <button key={q} onClick={()=>setChatInput(q)} style={{background:"rgba(53,64,36,0.08)",border:"1.5px solid rgba(53,64,36,0.14)",borderRadius:20,padding:"4px 12px",color:C.k,fontSize:11,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:500}}>{q}</button>
            ))}
          </div>
        </div>
        <button onClick={()=>{setStep(1);setResult(null);setSkills([]);setInterests([]);setExp("");setEdu("");setChat([]);}} style={{marginTop:12,background:"rgba(53,64,36,0.08)",border:"1.5px solid rgba(53,64,36,0.2)",borderRadius:11,padding:"10px 20px",color:C.k,fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>↺ Start over</button>
      </div>}
    </div>
  );
}

// ══ RESUME ANALYZER — File Upload version ══
function ResumeAnalyzer() {
  const [resumeText, setResumeText] = useState("");
  const [fileName, setFileName] = useState("");
  const [loading, setLoading] = useState(false);
  const [extracting, setExtracting] = useState(false);
  const [activeCheck, setActiveCheck] = useState(null);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [showPaste, setShowPaste] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const fileRef = useRef();

  const handleFile = async (file) => {
    if(!file) return;
    const isAllowed = file.name.endsWith(".txt") || file.name.endsWith(".docx") || file.name.endsWith(".pdf") || file.type==="text/plain" || file.type==="application/pdf" || file.type.includes("wordprocessingml");
    if(!isAllowed){ setError("Please upload a PDF, DOCX, or TXT file."); return; }
    setExtracting(true); setError(""); setFileName(file.name); setResult(null); setActiveCheck(null); setShowPaste(false);
    try {
      const text = await extractTextFromFile(file);
      const cleaned = (text||"").replace(/\s+/g," ").trim();
      if(cleaned.length < 80) {
        // Show paste fallback instead of hard error
        setShowPaste(true);
        setError("");
        setResumeText("");
      } else {
        setResumeText(cleaned);
        setError("");
      }
    } catch(e){
      setShowPaste(true);
      setError("");
    }
    setExtracting(false);
  };

  const analyze = async (type) => {
    if(!resumeText.trim()){setError("Please upload your resume first.");return;}
    setLoading(true); setActiveCheck(type); setError(""); setResult(null);
    try {
      let prompt = "";
      if(type==="career") prompt = `Analyze this resume and suggest careers. Resume: ${resumeText.substring(0,2500)}. JSON only: {"name":"Name","current_level":"Fresher/Junior/Mid/Senior","top_skills":["s1","s2","s3","s4","s5"],"career_matches":[{"career":"C","match_score":90,"reason":"why","salary":"₹X–Y LPA","demand":"High"},{"career":"C","match_score":80,"reason":"why","salary":"₹X–Y LPA","demand":"High"},{"career":"C","match_score":70,"reason":"why","salary":"₹X–Y LPA","demand":"Medium"},{"career":"C","match_score":60,"reason":"why","salary":"₹X–Y LPA","demand":"Medium"}],"skill_gaps":["g1","g2","g3"],"immediate_actions":["a1","a2","a3"]}`;
      else if(type==="aws") prompt = `Check AWS readiness of this resume. Resume: ${resumeText.substring(0,2500)}. JSON only: {"aws_score":65,"aws_ready":false,"current_aws_skills":["s1","s2"],"missing_aws_skills":["m1","m2","m3"],"recommended_certification":"AWS Solutions Architect","cert_path":["Cloud Practitioner","Solutions Architect Associate","Solutions Architect Professional"],"study_time":"3–4 months","verdict":"One sentence verdict","job_roles":["Role1","Role2"]}`;
      else if(type==="rate") prompt = `Rate this resume professionally. Resume: ${resumeText.substring(0,2500)}. JSON only: {"overall_score":75,"grade":"B","sections":{"format":80,"content":75,"keywords":70,"impact":72,"ats_score":68},"strengths":["s1","s2","s3"],"improvements":["i1","i2","i3"],"ats_issues":["a1","a2"],"power_words_missing":["w1","w2","w3"],"quick_wins":["q1","q2","q3"],"summary":"2 sentence honest assessment"}`;
      else if(type==="interview") prompt = `Generate interview questions from this resume. Resume: ${resumeText.substring(0,2500)}. JSON only: {"technical_questions":["Q1","Q2","Q3","Q4","Q5"],"behavioral_questions":["Q1","Q2","Q3"],"project_questions":["Q1","Q2"],"tricky_questions":["Q1","Q2"],"preparation_tips":["t1","t2","t3"],"likely_role":"Role","difficulty":"Medium"}`;
      const text = await askClaude(prompt, 1000);
      setResult({type, data: parseJSON(text)});
    } catch(e){ setError(e.message==="NO_KEY"?"🔑 Please enter your Anthropic API key in the yellow banner above to use AI features.":"Failed: "+e.message); }
    setLoading(false);
  };

  const sc = s => s>=80?C.k:s>=60?C.m:"#7f1d1d";

  return (
    <div>
      {/* File Upload Zone */}
      <div
        onClick={()=>!extracting&&fileRef.current.click()}
        onDragOver={e=>e.preventDefault()}
        onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}
        style={{border:`2px dashed ${resumeText?"#889063":"rgba(53,64,36,0.3)"}`,borderRadius:14,padding:"28px",textAlign:"center",cursor:extracting?"wait":"pointer",background:resumeText?"rgba(136,144,99,0.08)":C.t,transition:"all .2s",marginBottom:14}}
      >
        <input ref={fileRef} type="file" accept=".pdf,.docx,.txt" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
        {extracting ? (
          <div>
            <div style={{fontSize:32,marginBottom:8}}>⏳</div>
            <div style={{fontSize:14,fontWeight:700,color:C.k}}>Extracting text from resume...</div>
          </div>
        ) : resumeText ? (
          <div>
            <div style={{fontSize:32,marginBottom:8}}>✅</div>
            <div style={{fontSize:14,fontWeight:700,color:C.k,marginBottom:3}}>Resume loaded: {fileName}</div>
            <div style={{fontSize:12,color:C.m}}>{resumeText.trim().split(/\s+/).length} words extracted · Click to change file</div>
          </div>
        ) : (
          <div>
            <div style={{fontSize:40,marginBottom:10}}>📂</div>
            <div style={{fontSize:15,fontWeight:700,color:C.k,marginBottom:5}}>Upload your Resume</div>
            <div style={{fontSize:13,color:C.m,marginBottom:8}}>Drag & drop or click to browse</div>
            <div style={{display:"inline-flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}>
              {["PDF","DOCX","TXT"].map(f=>(
                <span key={f} style={{background:"rgba(53,64,36,0.1)",borderRadius:20,padding:"3px 11px",fontSize:11,color:C.k,fontWeight:700}}>{f}</span>
              ))}
            </div>
          </div>
        )}
      </div>

      {error&&<div style={{background:"#fee2e2",border:"1px solid #fca5a5",borderRadius:10,padding:"11px",color:"#7f1d1d",fontSize:13,marginBottom:12,fontWeight:500}}>{error}</div>}

      {/* Paste fallback when PDF extraction fails */}
      {showPaste&&(
        <div style={{background:"#fffbeb",border:"2px solid #889063",borderRadius:13,padding:"16px",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{fontSize:18}}>📋</span>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,color:"#354024"}}>Could not auto-read this PDF</div>
          </div>
          <div style={{fontSize:12,color:"#4C3D19",marginBottom:10,lineHeight:1.6,fontWeight:500}}>
            Some PDFs are image-based (scanned) and can't be read automatically.<br/>
            <b>Fix:</b> Open your resume, Select All (Ctrl+A), Copy (Ctrl+C), then paste below:
          </div>
          <textarea
            value={pasteText}
            onChange={e=>setPasteText(e.target.value)}
            placeholder="Paste your resume text here... (Ctrl+A then Ctrl+C from your PDF/Word doc)"
            style={{width:"100%",minHeight:130,background:"#fff",border:"2px solid rgba(53,64,36,0.22)",borderRadius:10,padding:"11px 13px",color:"#354024",fontSize:12,fontFamily:"'DM Sans',sans-serif",outline:"none",resize:"vertical",boxSizing:"border-box",lineHeight:1.6,fontWeight:500}}
          />
          <div style={{display:"flex",gap:9,marginTop:10}}>
            <button
              onClick={()=>{const t=pasteText.trim();if(t.length<80){setError("Please paste more text — at least a few lines of your resume.");return;}setResumeText(t);setShowPaste(false);setError("");}}
              style={{background:"#354024",border:"none",borderRadius:9,padding:"9px 20px",color:"#E5D7C4",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}
            >Use this text ✓</button>
            <button
              onClick={()=>{setShowPaste(false);setPasteText("");setFileName("");}}
              style={{background:"rgba(53,64,36,0.08)",border:"1.5px solid rgba(53,64,36,0.2)",borderRadius:9,padding:"9px 16px",color:"#889063",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}
            >Cancel</button>
          </div>
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:18}}>
        {[{id:"career",icon:"🎯",label:"Suggest Careers",desc:"AI matches resume to careers"},{id:"aws",icon:"☁️",label:"AWS Readiness",desc:"Check AWS friendliness"},{id:"rate",icon:"⭐",label:"Rate My Resume",desc:"Score + ATS + tips"},{id:"interview",icon:"🎤",label:"Interview Prep",desc:"AI generates questions"}].map(btn=>(
          <button key={btn.id} onClick={()=>analyze(btn.id)} disabled={loading||!resumeText} style={{background:activeCheck===btn.id&&result?`linear-gradient(135deg,${C.k},${C.m})`:C.t,border:`1.5px solid ${activeCheck===btn.id&&result?C.k:"rgba(53,64,36,0.2)"}`,borderRadius:13,padding:"14px 12px",cursor:loading||!resumeText?"not-allowed":"pointer",textAlign:"left",transition:"all .2s",opacity:(loading&&activeCheck!==btn.id)||!resumeText?0.5:1}}>
            <div style={{fontSize:20,marginBottom:5}}>{btn.icon}</div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:12,fontWeight:700,color:activeCheck===btn.id&&result?C.b:C.k}}>{btn.label}</div>
            <div style={{fontSize:11,color:activeCheck===btn.id&&result?"rgba(229,215,196,0.7)":C.m,marginTop:2,fontWeight:500}}>{btn.desc}</div>
          </button>
        ))}
      </div>
      {loading&&<div style={{textAlign:"center",padding:"24px",background:C.t,borderRadius:14,marginBottom:16}}><div style={{fontSize:28,marginBottom:8}}>⏳</div><div style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:700,color:C.k}}>Claude AI is analyzing your resume...</div><div style={{fontSize:12,color:C.m,marginTop:4,fontWeight:500}}>This takes 10–20 seconds</div></div>}
      {!loading&&result&&(
        <div>
          {result.type==="career"&&<div>
            <div style={{background:`linear-gradient(135deg,${C.k},${C.m})`,borderRadius:16,padding:"20px 22px",marginBottom:14}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:C.b,marginBottom:6}}>{result.data.name} — {result.data.current_level}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:5}}>{result.data.top_skills?.map(s=><span key={s} style={{background:"rgba(229,215,196,0.15)",borderRadius:20,padding:"3px 11px",fontSize:11,color:C.b,fontWeight:500}}>{s}</span>)}</div>
            </div>
            {result.data.career_matches?.map((c,i)=>(
              <div key={c.career} style={{background:C.t,border:`1.5px solid rgba(53,64,36,${i===0?0.25:0.12})`,borderRadius:13,padding:"14px 16px",marginBottom:10,display:"flex",gap:13,alignItems:"center"}}>
                <div style={{textAlign:"center",minWidth:52}}><div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,color:sc(c.match_score)}}>{c.match_score}%</div>{i===0&&<div style={{fontSize:9,color:C.m,fontWeight:700}}>TOP</div>}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:2}}><div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,color:C.k}}>{c.career}</div><span style={{background:"rgba(53,64,36,0.1)",borderRadius:20,padding:"1px 8px",fontSize:10,color:C.k,fontWeight:700}}>{c.demand}</span></div>
                  <div style={{fontSize:12,color:C.d,lineHeight:1.5,fontWeight:500,marginBottom:3}}>{c.reason}</div>
                  <div style={{fontSize:12,color:C.m,fontWeight:600}}>💰 {c.salary}</div>
                </div>
              </div>
            ))}
          </div>}
          {result.type==="aws"&&<div>
            <div style={{background:"linear-gradient(135deg,#354024,#232f3e)",borderRadius:16,padding:"20px 22px",marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
                <div>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:19,fontWeight:700,color:C.b,marginBottom:4}}>{result.data.recommended_certification}</div>
                  <div style={{fontSize:13,color:C.t,fontWeight:500}}>{result.data.verdict}</div>
                  <div style={{fontSize:12,color:C.t,marginTop:6,fontWeight:500}}>Study time: {result.data.study_time}</div>
                </div>
                <div style={{textAlign:"center"}}>
                  <div style={{fontFamily:"'Syne',sans-serif",fontSize:44,fontWeight:800,color:C.b,lineHeight:1}}>{result.data.aws_score}</div>
                  <div style={{fontSize:10,color:C.t,fontWeight:600}}>/100 AWS SCORE</div>
                  <div style={{fontSize:11,color:result.data.aws_ready?"#86efac":"#fca5a5",marginTop:4,fontWeight:700}}>{result.data.aws_ready?"✅ Ready":"⚠️ Not Yet"}</div>
                </div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.12)",borderRadius:13,padding:"14px"}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:12,fontWeight:700,color:C.k,marginBottom:10}}>✅ AWS Skills You Have</div>
                {result.data.current_aws_skills?.length?result.data.current_aws_skills.map(s=><div key={s} style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}><span style={{color:C.m}}>✓</span><span style={{fontSize:12,color:C.k,fontWeight:500}}>{s}</span></div>):<div style={{fontSize:12,color:C.m}}>None detected</div>}
              </div>
              <div style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.12)",borderRadius:13,padding:"14px"}}>
                <div style={{fontFamily:"'Syne',sans-serif",fontSize:12,fontWeight:700,color:C.k,marginBottom:10}}>📚 Skills to Learn</div>
                {result.data.missing_aws_skills?.map((s,i)=><div key={s} style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}><span style={{width:16,height:16,borderRadius:"50%",background:"rgba(53,64,36,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:C.m,flexShrink:0}}>{i+1}</span><span style={{fontSize:12,color:C.k,fontWeight:500}}>{s}</span></div>)}
              </div>
            </div>
            <div style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.12)",borderRadius:13,padding:"14px"}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:12,fontWeight:700,color:C.k,marginBottom:10}}>🗺 Cert Path</div>
              <div style={{display:"flex",alignItems:"center",gap:0,flexWrap:"wrap"}}>
                {result.data.cert_path?.map((cert,i)=>(

                <div style={{fontSize:13,color:C.t,lineHeight:1.6,maxWidth:300,fontWeight:500}}>{result.data.summary}</div>

            <div style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.12)",borderRadius:13,padding:"16px",marginBottom:12}}>

// ══ SALARY INSIGHTS ══
function SalaryInsights() {
  const [role, setRole] = useState("");
  const [city, setCity] = useState("");
  const [exp, setExp] = useState("");
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const ROLES = ["Software Engineer","Data Scientist","ML Engineer","Frontend Developer","Backend Developer","DevOps Engineer","Cloud Architect","Product Manager","Data Analyst","Cybersecurity Analyst"];
  const CITIES = ["Bangalore","Mumbai","Hyderabad","Chennai","Pune","Delhi/NCR","Kolkata","Remote"];
  const EXPS = ["0–1 yr","1–3 yrs","3–5 yrs","5–8 yrs","8+ yrs"];

  const getSalary = async () => {
    setLoading(true);
    try {
      const text = await askClaude(`Indian tech salary data. Role:${role}, City:${city}, Exp:${exp}. JSON only: {"min_salary":"₹X LPA","max_salary":"₹Y LPA","avg_salary":"₹Z LPA","top_companies":[{"name":"Co","salary":"₹X–Y LPA"},{"name":"Co","salary":"₹X–Y LPA"},{"name":"Co","salary":"₹X–Y LPA"}],"negotiation_tips":["t1","t2","t3"],"in_demand_skills":["s1","s2","s3"],"growth_rate":"X% YoY","market_verdict":"Hot/Stable/Cooling","bonus_info":"typical bonus info"}`, 700);
      setData(parseJSON(text));
    } catch(e){ alert(e.message==="NO_KEY"?"🔑 Please enter your Anthropic API key in the yellow banner above.":"Failed: "+e.message); }

  };

  const Sel = ({label, value, onChange, options}) => (

      </div>
      <button onClick={getSalary} disabled={!role||!city||!exp||loading} style={{background:(!role||!city||!exp)?"rgba(53,64,36,0.1)":C.k,border:"none",borderRadius:11,padding:"11px 24px",color:(!role||!city||!exp)?C.m:C.b,fontSize:14,fontWeight:700,cursor:(!role||!city||!exp)||loading?"not-allowed":"pointer",fontFamily:"'DM Sans',sans-serif",marginBottom:18}}>
        {loading?"⏳ Fetching...":"💰 Get Salary Report"}
      </button>
      {data&&(
        <div>
          <div style={{background:`linear-gradient(135deg,${C.k},${C.m})`,borderRadius:16,padding:"20px 22px",marginBottom:14}}>
            <div style={{fontSize:10,letterSpacing:"2px",color:"rgba(229,215,196,0.7)",textTransform:"uppercase",fontWeight:600,marginBottom:10}}>{role} · {city} · {exp}</div>

                <div key={l}><div style={{fontSize:10,color:"rgba(229,215,196,0.6)",marginBottom:2,fontWeight:500}}>{l}</div><div style={{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800,color:C.b}}>{v}</div></div>

            <div style={{display:"flex",gap:9,flexWrap:"wrap"}}>

              <span style={{background:"rgba(229,215,196,0.15)",borderRadius:20,padding:"3px 13px",fontSize:11,color:C.b,fontWeight:600}}>🔥 {data.market_verdict}</span>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <div style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.12)",borderRadius:13,padding:"14px"}}>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:12,fontWeight:700,color:C.k,marginBottom:11}}>Top Companies</div>

              <div style={{fontFamily:"'Syne',sans-serif",fontSize:12,fontWeight:700,color:C.k,marginBottom:11}}>Negotiation Tips 🤝</div>

            </div>
          </div>
        </div>
      )}
    </div>
  );

function CoursePage({course, onBack, user}) {
  const list_data = course.lessons_data || [
    {id:1,title:"Introduction",duration:"10 min",type:"video",done:true},
    {id:2,title:"Core Concepts",duration:"20 min",type:"video",done:false},
    {id:3,title:"Advanced Topics",duration:"25 min",type:"video",done:false},
    {id:4,title:"Final Quiz",duration:"15 min",type:"quiz",done:false},
  ];
  const videoIds = course.videoIds || ["aircAruvnKk","PeMlggyqz0Y","ukzFI9rgwfU","E0Ld7ZgsuoA"];
  const QUIZ = course.quiz || [
    {q:"What is the main topic of this course?",opts:["Option A","Option B","The course subject","Option D"],ans:2},
    {q:"What is a best practice in this domain?",opts:["Ignore documentation","Follow standards","Skip testing","None"],ans:1},
    {q:"How do you improve in this field?",opts:["Stop learning","Practice consistently","Copy others","None"],ans:1}
  ];

  const [active, setActive] = useState(list_data[0]);
  const [list, setList] = useState(list_data);
  const [answers, setAnswers] = useState({});
  const [quizDone, setQuizDone] = useState(false);
  const [showCert, setShowCert] = useState(false);

  const idx = list.findIndex(l=>l.id===active.id);
  const donePct = Math.round(list.filter(l=>l.done).length/list.length*100);
  const score = Object.entries(answers).filter(([i,a])=>QUIZ[+i]?.ans===+a).length;
  const passed = score>=Math.ceil(QUIZ.length*0.6);
  const markDone = id => setList(p=>p.map(l=>l.id===id?{...l,done:true}:l));
  const next = () => { const n=list[idx+1]; if(n){markDone(active.id);setActive(n);} };

  // Get the YouTube video ID for current lesson
  const currentVideoId = videoIds[idx] || videoIds[0] || "aircAruvnKk";

  return (
    <div style={{minHeight:"100vh",background:C.b,display:"flex",flexDirection:"column"}}>
      <style>{`.lr{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:9px;cursor:pointer;border:1.5px solid transparent;transition:all .2s}.lr:hover{background:rgba(53,64,36,0.06)}.lr.on{background:rgba(53,64,36,0.1);border-color:rgba(53,64,36,0.22)}.qb{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:11px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1.5px solid rgba(53,64,36,0.18);background:#CFBB99;color:#354024;transition:all .2s;margin-bottom:8px;font-weight:500}.qb:hover{border-color:#354024;background:#E5D7C4}.qb.sel{border-color:#354024;background:#354024;color:#E5D7C4;font-weight:700}.qb.ok{border-color:#889063;background:rgba(136,144,99,0.2);color:#354024;font-weight:700}.qb.no{border-color:#7f1d1d;background:rgba(127,29,29,0.08);color:#7f1d1d}`}</style>

      <header style={{background:C.k,padding:"12px 20px",display:"flex",alignItems:"center",gap:13,position:"sticky",top:0,zIndex:100,boxShadow:"0 4px 20px rgba(53,64,36,0.3)"}}>
        <button onClick={onBack} style={{background:"rgba(229,215,196,0.12)",border:"1.5px solid rgba(229,215,196,0.22)",borderRadius:7,padding:"6px 12px",color:C.t,fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:500,flexShrink:0}}>← Back</button>
        <span style={{fontSize:18,flexShrink:0}}>{course.thumb}</span>
        <div style={{flex:1,minWidth:0}}><div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:700,color:C.b,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{course.title}</div><div style={{fontSize:11,color:C.m,fontWeight:500}}>{list.length} lessons</div></div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}><span style={{fontSize:11,color:C.t,fontWeight:500}}>{donePct}%</span><div style={{width:80,background:"rgba(229,215,196,0.14)",borderRadius:3,height:5}}><div style={{width:`${donePct}%`,height:5,borderRadius:3,background:`linear-gradient(90deg,${C.m},${C.t})`,transition:"width .5s"}}/></div></div>
      </header>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        <aside style={{width:260,minWidth:260,borderRight:"1.5px solid rgba(53,64,36,0.12)",padding:"14px 10px",overflowY:"auto",background:C.t}}>
          <div style={{fontSize:10,fontWeight:700,color:C.m,letterSpacing:"1px",textTransform:"uppercase",marginBottom:10}}>Curriculum</div>
          {list.map((l,i)=>(
            <div key={l.id} className={`lr ${active.id===l.id?"on":""}`} onClick={()=>setActive(l)}>
              <div style={{width:23,height:23,borderRadius:"50%",background:l.done?C.m:"rgba(53,64,36,0.07)",border:`1.5px solid ${l.done?C.k:"rgba(53,64,36,0.18)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:l.done?C.b:C.m,flexShrink:0,fontWeight:700}}>{l.done?"✓":i+1}</div>
              <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,color:active.id===l.id?C.k:C.d,fontWeight:active.id===l.id?700:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.title}</div><div style={{fontSize:10,color:C.m,marginTop:1,fontWeight:500}}>{l.type==="quiz"?"📝":"▶"} {l.duration}</div></div>
            </div>
          ))}
        </aside>

        <main style={{flex:1,padding:"24px 28px",overflowY:"auto"}}>
          {showCert&&(
            <div style={{maxWidth:560,margin:"0 auto",textAlign:"center"}}>
              <div style={{background:`linear-gradient(135deg,${C.k},${C.m})`,borderRadius:20,padding:"38px 32px",boxShadow:"0 16px 48px rgba(53,64,36,0.32)"}}>
                <div style={{fontSize:56,marginBottom:12}}>🏅</div>
                <div style={{fontFamily:"'Playfair Display',serif",fontSize:24,fontWeight:700,color:C.b,marginBottom:5}}>Congratulations!</div>
                <div style={{fontSize:13,color:C.t,marginBottom:24,fontWeight:500}}>You successfully completed</div>
                <div style={{background:"rgba(229,215,196,0.1)",border:"1.5px solid rgba(229,215,196,0.25)",borderRadius:14,padding:"22px",marginBottom:22}}>
                  <div style={{fontSize:9,letterSpacing:"3px",color:"rgba(229,215,196,0.5)",textTransform:"uppercase",marginBottom:8,fontWeight:600}}>Certificate of Completion</div>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:C.b,marginBottom:5}}>{course.title}</div>
                  <div style={{fontSize:12,color:C.t,fontWeight:500}}>SkillPath AI · {new Date().toLocaleDateString("en-IN",{year:"numeric",month:"long",day:"numeric"})}</div>
                  <div style={{display:"flex",justifyContent:"center",gap:4,marginTop:10}}>{"★★★★★".split("").map((s,i)=><span key={i} style={{color:C.m,fontSize:16}}>{s}</span>)}</div>
                </div>
                <button
                  onClick={()=>downloadCertificatePDF(course.title, user?.name||"Learner")}
                  style={{background:C.b,border:"none",borderRadius:12,padding:"14px 26px",color:C.k,fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",display:"block",width:"100%",marginBottom:10}}
                >
                  ⬇️ Download Certificate PDF
                </button>
                <button onClick={onBack} style={{background:"rgba(229,215,196,0.1)",border:"1.5px solid rgba(229,215,196,0.22)",borderRadius:11,padding:"10px",color:C.t,fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",width:"100%",fontWeight:500}}>← Back to courses</button>
              </div>
            </div>
          )}

          {!showCert&&active.type==="quiz"&&(
            <div style={{maxWidth:560}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,color:C.k,marginBottom:5}}>Final Quiz 📝</div>
              <div style={{fontSize:13,color:C.m,marginBottom:24,fontWeight:500}}>Score {Math.ceil(QUIZ.length*0.6)}/{QUIZ.length} to earn your certificate</div>
              {QUIZ.map((q,qi)=>(
                <div key={qi} style={{marginBottom:22,background:C.t,borderRadius:14,padding:"16px",border:"1.5px solid rgba(53,64,36,0.12)"}}>
                  <div style={{fontSize:14,color:C.k,fontWeight:700,marginBottom:12,lineHeight:1.5}}>Q{qi+1}. {q.q}</div>
                  {q.opts.map((o,oi)=>{let cls="qb";if(quizDone){if(oi===q.ans)cls+=" ok";else if(answers[qi]===oi)cls+=" no";}else if(answers[qi]===oi)cls+=" sel";return <button key={oi} className={cls} disabled={quizDone} onClick={()=>setAnswers({...answers,[qi]:oi})}>{String.fromCharCode(65+oi)}. {o}</button>;})}
                </div>
              ))}
              {!quizDone?(
                <button disabled={Object.keys(answers).length<QUIZ.length} onClick={()=>{setQuizDone(true);if(passed)setTimeout(()=>setShowCert(true),600);}} style={{background:Object.keys(answers).length<QUIZ.length?"rgba(53,64,36,0.1)":C.k,border:"none",borderRadius:11,padding:"12px 28px",color:Object.keys(answers).length<QUIZ.length?C.m:C.b,fontSize:14,fontWeight:700,cursor:Object.keys(answers).length<QUIZ.length?"not-allowed":"pointer",fontFamily:"'DM Sans',sans-serif"}}>Submit Quiz →</button>
              ):(
                <div style={{background:passed?"rgba(53,64,36,0.08)":"rgba(127,29,29,0.06)",border:`2px solid ${passed?C.m:"#fca5a5"}`,borderRadius:13,padding:"18px",textAlign:"center"}}>
                  <div style={{fontSize:34,marginBottom:7}}>{passed?"🎉":"😕"}</div>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:700,color:passed?C.k:"#7f1d1d",marginBottom:4}}>{passed?"Passed! Certificate ready!":"Try again"}</div>
                  <div style={{fontSize:13,color:C.m,fontWeight:500}}>Score: {score}/{QUIZ.length}</div>
                  {!passed&&<button onClick={()=>{setQuizDone(false);setAnswers({});}} style={{marginTop:11,background:C.k,border:"none",borderRadius:9,padding:"8px 20px",color:C.b,fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>Retry</button>}
                  {passed&&<button onClick={()=>setShowCert(true)} style={{marginTop:11,background:C.m,border:"none",borderRadius:9,padding:"10px 22px",color:C.b,fontSize:13,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:700}}>View Certificate 🏅</button>}
                </div>
              )}
            </div>
          )}

          {!showCert&&active.type!=="quiz"&&(
            <div style={{maxWidth:760}}>
              <div style={{fontFamily:"'Playfair Display',serif",fontSize:19,fontWeight:700,color:C.k,marginBottom:4}}>{active.title}</div>
              <div style={{fontSize:12,color:C.m,marginBottom:16,fontWeight:500}}>Lesson {idx+1} of {list.length} · {active.duration}</div>

              {/* ✅ FIXED: Embedded YouTube video player */}
              <div style={{position:"relative",paddingBottom:"56.25%",height:0,borderRadius:15,overflow:"hidden",marginBottom:18,background:C.k,border:"2px solid rgba(53,64,36,0.18)",boxShadow:"0 8px 28px rgba(53,64,36,0.22)"}}>
                <iframe
                  key={active.id+"-"+currentVideoId}
                  src={`https://www.youtube.com/embed/${currentVideoId}?rel=0&modestbranding=1&autoplay=0&fs=1&iv_load_policy=3`}
                  title={active.title}
                  frameBorder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowFullScreen
                  referrerPolicy="strict-origin-when-cross-origin"
                  style={{position:"absolute",top:0,left:0,width:"100%",height:"100%"}}
                />
              </div>

              <div style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.14)",borderRadius:12,padding:"14px 17px",marginBottom:18}}>
                <div style={{fontSize:12,fontWeight:700,color:C.k,marginBottom:4}}>💡 Key takeaways</div>
                <div style={{fontSize:12,color:C.d,lineHeight:1.7,fontWeight:500}}>Watch the full video and take notes. Click <strong>Mark Complete & Next</strong> to progress toward your certificate.</div>
              </div>
              <div style={{display:"flex",gap:10}}>
                {idx>0&&<button onClick={()=>{const p=list[idx-1];if(p)setActive(p);}} style={{background:C.t,border:"1.5px solid rgba(53,64,36,0.2)",borderRadius:9,padding:"10px 18px",color:C.k,fontSize:12,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:600}}>← Previous</button>}
                <button onClick={next} style={{background:`linear-gradient(135deg,${C.k},${C.m})`,border:"none",borderRadius:9,padding:"10px 24px",color:C.b,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",flex:1,maxWidth:260}}>
                  {idx===list.length-1?"Finish Course 🏁":"Mark Complete & Next →"}
                </button>
              </div>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

// ══ APP ROOT ══
function App() {
  const [user, setUser] = useState(null);
  const [activeCourse, setActiveCourse] = useState(null);

  if(!user) return <Landing onLogin={setUser}/>;
  if(activeCourse) return <CoursePage course={activeCourse} onBack={()=>setActiveCourse(null)} user={user}/>;
  if(user.isAdmin) return <AdminDashboard onLogout={()=>setUser(null)}/>;
  return <Dashboard user={user} onLogout={()=>setUser(null)} onCourse={setActiveCourse}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
